<!-- ===========================================================
     Vertretungspool Wochenendpräsenz — HTML-Macro Body (Server 7.4)
     Schlank & sanitizer-fest halten. ALLE Logik/Styles/DOM erzeugt
     app.js zur Laufzeit (JS-erzeugtes DOM laeuft NICHT durch
     Sanitizer/Velocity).
     persistence.js + app.js + seed.json + (Logo) als ANHAENGE dieser
     Seite hochladen (Build-Dateien aus dist/deploy, s. README).
     Reihenfolge: persistence.js VOR app.js. Cache-Bust ?v=Date.now(),
     damit nie eine alte, gecachte app.js laeuft.
     =========================================================== -->
<div id="wp-root"><!-- wird durch app.js befuellt --></div>
<script type="text/javascript">
    (function () {
        /* ADMINS: Confluence-Benutzername (Login-Name aus der Profil-URL
     /display/~benutzername) oder userKey. Gross-/Kleinschreibung egal.
     Admin = darf im Detail-Dialog alles aendern (Datum, Eintragsdatum,
     Dienst von, Beworbene, Vertretung) und Dienste loeschen.
     Anzeigenamen mit "carsten" am Anfang sind zusaetzlich Admin. */
        window.WP_ADMINS = ["USERNAME_1", "USERNAME_2"];

        function getPageId() {
            if (window.AJS) {
                if (AJS.Meta) {
                    var v = AJS.Meta.get("page-id");
                    if (v) {
                        return v;
                    }
                }
                if (AJS.params) {
                    if (AJS.params.pageId) {
                        return AJS.params.pageId;
                    }
                }
            }
            var m = document.querySelector('meta[name="ajs-page-id"]');
            if (m) {
                return m.getAttribute("content");
            }
            return "";
        }
        function getCtx() {
            if (window.AJS) {
                if (AJS.contextPath) {
                    return AJS.contextPath();
                }
            }
            return "";
        }
        function fail(msg) {
            var r = document.getElementById("wp-root");
            if (r) {
                r.textContent = msg;
                r.style.cssText = "background:#ffeceb;color:#ae2a19;border:1px solid #ae2a19;border-radius:6px;padding:10px 12px;font:13px sans-serif";
            }
        }
        var pid = getPageId();
        if (!pid) {
            fail("Seiten-ID nicht gefunden.");
            return;
        }
        var files = ["persistence.js", "app.js"];
        var bust = Date.now();
        function next(i) {
            if (i >= files.length) {
                return;
            }
            var s = document.createElement("script");
            s.src = getCtx() + "/download/attachments/" + pid + "/" + files[i] + "?v=" + bust;
            s.async = false;
            s.onload = function () {
                next(i + 1);
            };
            s.onerror = function () {
                fail("Fehler beim Laden: " + files[i] + " (Anhang fehlt?)");
            };
            document.body.appendChild(s);
        }
        next(0);
    })();
</script>
